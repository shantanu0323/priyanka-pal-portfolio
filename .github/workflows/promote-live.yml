name: Promote main to live

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-live
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor == 'shantanu0323' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Fast-forward live to main
        run: git push origin "${GITHUB_SHA}:refs/heads/live"
